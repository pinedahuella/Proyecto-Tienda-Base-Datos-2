<!doctype html>
<html lang="es-GT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2F3A8F" />

		<!-- El favicon vive en static/ y SvelteKit lo sirve en la raiz.
		     Es el mismo simbolo del logotipo: hilos entrelazados. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />

		<!-- El tema se aplica ANTES de pintar. Si se hiciera desde un componente,
		     la pagina saldria clara un instante y despues saltaria a oscura. -->
		<script>
			(function () {
				try {
					var g = localStorage.getItem('mesh.tema');
					if (g !== 'claro' && g !== 'oscuro') {
						g = window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'oscuro'
							: 'claro';
					}
					document.documentElement.dataset.tema = g;
				} catch (e) {
					document.documentElement.dataset.tema = 'claro';
				}
			})();
		</script>

		<!-- Sin Google Fonts: la pila del sistema no necesita red y se ve igual
		     en las tres maquinas del equipo. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
