<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon de Mesh.

    El mismo simbolo del logotipo: hilos de urdimbre y de trama entrelazados.
    Aqui van sobre fondo solido y con trazo grueso, porque a 16 px una linea
    fina desaparece. Los cortes en los horizontales son los cruces: ahi el hilo
    pasa por debajo.
  -->
  <rect width="64" height="64" rx="14" fill="#2F3A8F"/>
  <g stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none">
    <!-- urdimbre -->
    <path d="M24 12 V52"/>
    <path d="M40 12 V52"/>
    <!-- trama, cortada en los cruces -->
    <path d="M12 24 H19"/>
    <path d="M29 24 H35"/>
    <path d="M45 24 H52"/>
    <path d="M12 40 H19"/>
    <path d="M29 40 H35"/>
    <path d="M45 40 H52"/>
  </g>
</svg>
