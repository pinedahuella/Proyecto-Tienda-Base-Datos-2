# Las credenciales salen del archivo .env, que no se sube al repositorio.
# Si falta una variable, Compose se detiene con el mensaje que va despues del "?"
# en vez de arrancar con valores en blanco.

services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: mesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql, no en .../data
      - postgres-data:/var/lib/postgresql
      # Los scripts SQL quedan accesibles dentro del contenedor
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mesh-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?falta PGADMIN_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Deja el servidor "Mesh" ya registrado, sin tener que agregarlo a mano.
      # Los dos archivos los genera arrancar.ps1 a partir del .env.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    # pgAdmin exige que el archivo de contrasenas tenga permisos 600, y un
    # volumen montado desde Windows no los trae. Por eso se copia a /tmp antes.
    entrypoint: >
      /bin/sh -c "cp -f /pgpass /tmp/pgpass && chmod 600 /tmp/pgpass
      && chown pgadmin:root /tmp/pgpass 2>/dev/null;
      /entrypoint.sh"
    depends_on:
      - postgres

  mongo:
    image: mongo:8
    container_name: mesh-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}
      # Base que usa el proyecto. Los scripts de mongo/ se corren contra esta.
      MONGO_INITDB_DATABASE: ${MONGO_DB:?falta MONGO_DB en .env}
    ports:
      # 27018 afuera y no 27017: Windows puede tener un MongoDB instalado como
      # servicio, que ya ocupa el 27017. Los dos pueden escuchar a la vez sin
      # dar error, y el que contesta en localhost es el de Windows: Compass y
      # el backend acaban hablando con la base equivocada, vacia y sin
      # contrasena. Se comprueba con la version: la nuestra es la del
      # contenedor, la otra es la que tenga instalada la maquina.
      # Adentro de la red de Docker se sigue usando el 27017 de siempre.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      # Los scripts de las colecciones quedan accesibles dentro del
      # contenedor, igual que las migraciones de PostgreSQL
      - ./mongo:/mongo:ro
    healthcheck:
      # ping no pide autenticacion, asi que sirve de latido sin credenciales
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # La ventana de MongoDB, lo que pgAdmin es para PostgreSQL: arbol de bases y
  # colecciones a la izquierda, panel para escribir consultas, y se pueden
  # crear bases y colecciones desde ahi.
  dbgate:
    image: dbgate/dbgate:latest
    container_name: mesh-dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: mongo

      # Se conecta por el nombre del servicio y por el puerto de ADENTRO, no
      # por localhost ni por el 27018: dbgate esta en la misma red de Docker.
      LABEL_mongo: Mesh MongoDB
      ENGINE_mongo: mongo@dbgate-plugin-mongo
      URL_mongo: mongodb://${MONGO_USER:?falta MONGO_USER en .env}:${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}@mongo:27017/?authSource=admin
    ports:
      - "3001:3000"
    volumes:
      # Guarda las consultas que uno deja escritas
      - dbgate-data:/root/.dbgate
    depends_on:
      - mongo

  # El almacen clave-valor de la Entrega 2: el carrito con expiracion por
  # inactividad y la oferta de inventario limitado.
  #
  # Lleva contrasena aunque sea local. Redis sin `requirepass` acepta a
  # cualquiera que alcance el puerto, y el 6379 es de los mas barridos que hay:
  # dejarlo abierto en una maquina con la red de la universidad no es un riesgo
  # teorico. La contrasena sale del .env, como las otras tres.
  #
  # `appendonly yes` para que el carrito sobreviva a un reinicio del
  # contenedor. Un carrito que se pierde porque se reinicio Docker se ve
  # exactamente igual que un TTL mal puesto, y esa confusion cuesta una tarde.
  redis:
    image: redis:8-alpine
    container_name: mesh-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}

  # La ventana de Redis, lo que pgAdmin es para PostgreSQL. Redis no trae
  # ninguna: `redis-cli` es todo lo que hay de fabrica.
  #
  # Se eligio RedisInsight y no una conexion de Redis en dbgate (que tambien
  # sabe) por una razon concreta de la entrega: RedisInsight ensena el TTL de
  # cada clave y lo cuenta hacia atras. La Entrega 2 pide "un tiempo de
  # expiracion configurado explicitamente", y esa pantalla ES la evidencia --
  # se ve el carrito perdiendo segundos y desapareciendo solo. En un listado de
  # filas eso no se ve.
  #
  # Las variables RI_* dejan la conexion ya cargada, sin tener que agregarla a
  # mano, igual que servers.json en pgAdmin.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: mesh-redisinsight
    restart: unless-stopped
    environment:
      # Por el nombre del servicio y el puerto de ADENTRO: RedisInsight esta en
      # la misma red de Docker, asi que "localhost" apuntaria a si mismo.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: Mesh Redis
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  # La base de grafos de la Entrega 2: cuentas, resenas y productos, para
  # detectar conjuntos de cuentas que se califican entre si.
  #
  # No lleva visor aparte: Neo4j trae el suyo dentro, en el puerto 7474 (ver
  # abajo). Y ademas DIBUJA el grafo -- nodos y flechas -- que es la forma de
  # mirar esto. Un visor de filas y columnas no ensenaria el anillo.
  #
  # Dos puertos, y hacen falta los dos: el 7474 es la ventana del navegador
  # (equivale a pgAdmin o a dbgate, no hay que montar nada aparte) y el 7687 es
  # bolt, por donde habla el backend. Abrir solo uno deja la mitad sin servir.
  #
  # El usuario tiene que llamarse `neo4j` en la edicion community: no se puede
  # cambiar. Por eso el .env solo pide la contrasena, y Neo4j la rechaza si
  # tiene menos de 8 caracteres.
  neo4j:
    image: neo4j:5-community
    container_name: mesh-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?falta NEO4J_PASSWORD en .env}
      # APOC trae las utilidades de carga e iteracion por lotes que el ETL
      # necesita para no mandar una transaccion por fila.
      NEO4J_PLUGINS: '["apoc"]'
      # La contrasena sola, para el healthcheck: NEO4J_AUTH la trae pegada al
      # usuario y cypher-shell la necesita aparte.
      #
      # El nombre NO lleva el prefijo NEO4J_, y eso es obligatorio: la imagen
      # trata CUALQUIER variable NEO4J_* como un ajuste de neo4j.conf. Una
      # NEO4J_PASSWORD se traduce al ajuste "PASSWORD", que no existe, y la
      # validacion estricta tumba el arranque en bucle con el mensaje
      # "Unrecognized setting. No declared setting with name: PASSWORD".
      # El contenedor se reinicia para siempre y el error no menciona Docker.
      MESH_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?falta NEO4J_PASSWORD en .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # El ETL deja aqui lo que carga, igual que migrations/ en PostgreSQL
      - ./neo4j:/neo4j:ro
    healthcheck:
      # cypher-shell y no un HTTP contra el 7474: el 7474 contesta antes de que
      # la base acepte consultas, asi que daria "sano" con Neo4j todavia
      # arrancando y el ETL fallaria contra un contenedor en verde.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$MESH_NEO4J_PASSWORD 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
  pgadmin-data:
  mongo-data:
  dbgate-data:
  redis-data:
  redisinsight-data:
  neo4j-data:
  neo4j-logs:
