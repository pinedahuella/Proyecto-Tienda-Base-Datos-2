# Las credenciales salen del archivo .env, que no se sube al repositorio.
# Si falta una variable, Compose se detiene con el mensaje que va despues del "?"
# en vez de arrancar con valores en blanco.

services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: mesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql, no en .../data
      - postgres-data:/var/lib/postgresql
      # Los scripts SQL quedan accesibles dentro del contenedor
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mesh-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?falta PGADMIN_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Deja el servidor "Mesh" ya registrado, sin tener que agregarlo a mano.
      # Los dos archivos los genera arrancar.ps1 a partir del .env.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    # pgAdmin exige que el archivo de contrasenas tenga permisos 600, y un
    # volumen montado desde Windows no los trae. Por eso se copia a /tmp antes.
    entrypoint: >
      /bin/sh -c "cp -f /pgpass /tmp/pgpass && chmod 600 /tmp/pgpass
      && chown pgadmin:root /tmp/pgpass 2>/dev/null;
      /entrypoint.sh"
    depends_on:
      - postgres

  mongo:
    image: mongo:8
    container_name: mesh-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}
      # Base que usa el proyecto. Los scripts de mongo/ se corren contra esta.
      MONGO_INITDB_DATABASE: ${MONGO_DB:?falta MONGO_DB en .env}
    ports:
      # 27018 afuera y no 27017: Windows puede tener un MongoDB instalado como
      # servicio, que ya ocupa el 27017. Los dos pueden escuchar a la vez sin
      # dar error, y el que contesta en localhost es el de Windows: Compass y
      # el backend acaban hablando con la base equivocada, vacia y sin
      # contrasena. Se comprueba con la version: la nuestra es la del
      # contenedor, la otra es la que tenga instalada la maquina.
      # Adentro de la red de Docker se sigue usando el 27017 de siempre.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      # Los scripts de las colecciones quedan accesibles dentro del
      # contenedor, igual que las migraciones de PostgreSQL
      - ./mongo:/mongo:ro
    healthcheck:
      # ping no pide autenticacion, asi que sirve de latido sin credenciales
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # La ventana de MongoDB, lo que pgAdmin es para PostgreSQL: arbol de bases y
  # colecciones a la izquierda, panel para escribir consultas, y se pueden
  # crear bases y colecciones desde ahi.
  dbgate:
    image: dbgate/dbgate:latest
    container_name: mesh-dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: mongo

      # Se conecta por el nombre del servicio y por el puerto de ADENTRO, no
      # por localhost ni por el 27018: dbgate esta en la misma red de Docker.
      LABEL_mongo: Mesh MongoDB
      ENGINE_mongo: mongo@dbgate-plugin-mongo
      URL_mongo: mongodb://${MONGO_USER:?falta MONGO_USER en .env}:${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}@mongo:27017/?authSource=admin
    ports:
      - "3001:3000"
    volumes:
      # Guarda las consultas que uno deja escritas
      - dbgate-data:/root/.dbgate
    depends_on:
      - mongo

  # El almacen clave-valor de la Entrega 2: el carrito con expiracion por
  # inactividad y la oferta de inventario limitado.
  #
  # Lleva contrasena aunque sea local. Redis sin `requirepass` acepta a
  # cualquiera que alcance el puerto, y el 6379 es de los mas barridos que hay:
  # dejarlo abierto en una maquina con la red de la universidad no es un riesgo
  # teorico. La contrasena sale del .env, como las otras tres.
  #
  # `appendonly yes` para que el carrito sobreviva a un reinicio del
  # contenedor. Un carrito que se pierde porque se reinicio Docker se ve
  # exactamente igual que un TTL mal puesto, y esa confusion cuesta una tarde.
  #
  # CONTROL DE ACCESO (Entrega final, desde el 2026-09-25). Tres usuarios de
  # ACL, uno por servicio, en vez de una sola contrasena para todo:
  #
  #   default     el backend y los scripts del equipo. Lee y escribe datos,
  #               corre los scripts Lua, y NO puede nada de @dangerous
  #               (FLUSHALL, CONFIG, KEYS, ACL, SHUTDOWN, DEBUG, MONITOR...).
  #               Se le devuelve solo INFO, que ioredis usa al conectar y el
  #               backend en su revision de salud.
  #   inspeccion  RedisInsight. Solo lectura, +@read, sin escribir ni borrar.
  #   operador    mantenimiento. Todo, con su propia contrasena.
  #
  # `reset` primero para que cada usuario nazca de cero y no herede nada del
  # default de fabrica. Las reglas viven aqui y no en un ACL SETUSER de
  # arrancar.ps1, porque asi valen tambien tras un reinicio del contenedor.
  # La prueba es redis/prueba_acceso.sh.
  #
  # El comando va como LISTA y no como una sola linea. Escrito en linea,
  # docker compose lo parte como un shell y el `>` de cada contrasena lo toma
  # por una redireccion, asi que corta ahi el comando entero sin avisar. Redis
  # arrancaba solo con `--user default reset on` y ningun usuario tenia clave.
  # "on" va entre comillas porque sin ellas YAML lo lee como un booleano.
  redis:
    image: redis:8-alpine
    container_name: mesh-redis
    restart: unless-stopped
    command:
      - redis-server
      - --user
      - default
      - reset
      - "on"
      - ">${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}"
      - "~*"
      - "&*"
      - "+@all"
      - "-@dangerous"
      - "+info"
      - --user
      - inspeccion
      - reset
      - "on"
      - ">${REDIS_INSPECCION_PASSWORD:?falta REDIS_INSPECCION_PASSWORD en .env}"
      - "~*"
      - "+@read"
      - "+@connection"
      - "-@dangerous"
      - "+info"
      - --user
      - operador
      - reset
      - "on"
      - ">${REDIS_OPERADOR_PASSWORD:?falta REDIS_OPERADOR_PASSWORD en .env}"
      - "~*"
      - "&*"
      - "+@all"
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}

  # La ventana de Redis, lo que pgAdmin es para PostgreSQL. Redis no trae
  # ninguna: `redis-cli` es todo lo que hay de fabrica.
  #
  # Se eligio RedisInsight y no una conexion de Redis en dbgate (que tambien
  # sabe) por una razon concreta de la entrega: RedisInsight ensena el TTL de
  # cada clave y lo cuenta hacia atras. La Entrega 2 pide "un tiempo de
  # expiracion configurado explicitamente", y esa pantalla ES la evidencia --
  # se ve el carrito perdiendo segundos y desapareciendo solo. En un listado de
  # filas eso no se ve.
  #
  # Las variables RI_* dejan la conexion ya cargada, sin tener que agregarla a
  # mano, igual que servers.json en pgAdmin.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: mesh-redisinsight
    restart: unless-stopped
    environment:
      # Por el nombre del servicio y el puerto de ADENTRO: RedisInsight esta en
      # la misma red de Docker, asi que "localhost" apuntaria a si mismo.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: Mesh Redis
      # Entra con el usuario de solo lectura. Mirar el TTL de un carrito no
      # necesita poder borrarlo.
      RI_REDIS_USERNAME: inspeccion
      RI_REDIS_PASSWORD: ${REDIS_INSPECCION_PASSWORD:?falta REDIS_INSPECCION_PASSWORD en .env}
      # Sin clave de cifrado, RedisInsight en Docker no puede guardar la
      # contrasena de la conexion ("Unsupported encryption strategy") y la
      # conexion de arriba no aparece. Se reusa un secreto del .env para no
      # pedirle otra variable a nadie.
      RI_ENCRYPTION_KEY: ${REDIS_INSPECCION_PASSWORD:?falta REDIS_INSPECCION_PASSWORD en .env}
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  # La base de grafos de la Entrega 2: cuentas, resenas y productos, para
  # detectar conjuntos de cuentas que se califican entre si.
  #
  # No lleva visor aparte: Neo4j trae el suyo dentro, en el puerto 7474 (ver
  # abajo). Y ademas DIBUJA el grafo -- nodos y flechas -- que es la forma de
  # mirar esto. Un visor de filas y columnas no ensenaria el anillo.
  #
  # Dos puertos, y hacen falta los dos: el 7474 es la ventana del navegador
  # (equivale a pgAdmin o a dbgate, no hay que montar nada aparte) y el 7687 es
  # bolt, por donde habla el backend. Abrir solo uno deja la mitad sin servir.
  #
  # El usuario tiene que llamarse `neo4j` en la edicion community: no se puede
  # cambiar. Por eso el .env solo pide la contrasena, y Neo4j la rechaza si
  # tiene menos de 8 caracteres.
  neo4j:
    image: neo4j:5-community
    container_name: mesh-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?falta NEO4J_PASSWORD en .env}
      # APOC trae las utilidades de carga e iteracion por lotes que el ETL
      # necesita para no mandar una transaccion por fila.
      NEO4J_PLUGINS: '["apoc"]'
      # La contrasena sola, para el healthcheck: NEO4J_AUTH la trae pegada al
      # usuario y cypher-shell la necesita aparte.
      #
      # El nombre NO lleva el prefijo NEO4J_, y eso es obligatorio: la imagen
      # trata CUALQUIER variable NEO4J_* como un ajuste de neo4j.conf. Una
      # NEO4J_PASSWORD se traduce al ajuste "PASSWORD", que no existe, y la
      # validacion estricta tumba el arranque en bucle con el mensaje
      # "Unrecognized setting. No declared setting with name: PASSWORD".
      # El contenedor se reinicia para siempre y el error no menciona Docker.
      MESH_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?falta NEO4J_PASSWORD en .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # El ETL deja aqui lo que carga, igual que migrations/ en PostgreSQL
      - ./neo4j:/neo4j:ro
    healthcheck:
      # cypher-shell y no un HTTP contra el 7474: el 7474 contesta antes de que
      # la base acepte consultas, asi que daria "sano" con Neo4j todavia
      # arrancando y el ETL fallaria contra un contenedor en verde.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$MESH_NEO4J_PASSWORD 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ------------------------------------------------------------------
  # Elasticsearch -- el motor de busqueda de la Entrega 3
  # ------------------------------------------------------------------
  # Es la QUINTA base y, como Neo4j, es una PROYECCION: la verdad sigue en
  # PostgreSQL y en el catalogo de Mongo. Se puede borrar entera y reconstruir
  # sin perder un dato, y por eso su volumen no es sagrado.
  #
  # Existe por lo que ninguna de las otras cuatro hace bien: escribir "labtop"
  # y que encuentre "laptop". El $text de Mongo Community no tiene difusa, y
  # aunque PostgreSQL si la hace con pg_trgm, el enunciado de la Entrega 3 pide
  # el motor dedicado.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: mesh-elastic
    restart: unless-stopped
    environment:
      # Un solo nodo. Sin esto arranca esperando companeros de cluster y se
      # queda sin elegir maestro, en amarillo, para siempre.
      discovery.type: single-node

      # Seguridad apagada, y es una decision de ENTORNO DE CLASE, no un olvido.
      # Con la 8.x la seguridad viene encendida y el contenedor genera
      # certificados y una contrasena al vuelo: cada `-Reiniciar` daria
      # credenciales nuevas y habria que ir a leerlas al log. Esta base no
      # guarda nada que no este ya en PostgreSQL y solo escucha en localhost.
      #
      # Si esto algun dia sale de una maquina de desarrollo, esta linea es la
      # primera que hay que quitar.
      xpack.security.enabled: "false"

      # EL HEAP SE FIJA A MANO, y aqui esta la razon de verdad.
      #
      # Sin esto la JVM se queda con la mitad de la RAM que ve, que en esta
      # maquina son varios GB para una base que va a guardar mil productos. Y
      # esta maquina ya se quedo sin memoria TRES veces el 2026-09-04, matando
      # el backend a media sesion. Neo4j ya es otra JVM corriendo al lado.
      #
      # Xms y Xmx iguales a proposito: una JVM que puede crecer, crece, y lo
      # hace justo cuando hay carga, que es el peor momento.
      #
      # 512m sobra para este catalogo. El dia que de verdad entre el millon de
      # productos de la prueba, este numero es el primero que hay que subir.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

      # El swap le hace mas dano que bien a un motor de busqueda, pero pedir
      # que se bloquee en memoria necesita limites del sistema que Docker
      # Desktop en Windows no siempre da. Se deja en false y se dice, en vez de
      # ponerlo en true y que el contenedor no arranque con un error de ulimit.
      bootstrap.memory_lock: "false"
    ports:
      # 9200 la API, 9300 el transporte entre nodos. El 9300 se publica solo
      # para poder mirarlo si algo raro pasa; con un nodo no se usa.
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      # Se pregunta por el ESTADO del cluster y no por "contesta el 9200". El
      # 9200 responde antes de que los indices esten listos, o sea que un curl
      # a secas daria sano con la base todavia arrancando -- la misma trampa
      # que ya mordio con el 7474 de Neo4j, aqui arriba.
      #
      # Se acepta yellow ademas de green: con UN solo nodo las replicas no se
      # pueden asignar a ningun lado, asi que un indice con replicas se queda
      # en amarillo para siempre y eso es lo normal, no un fallo.
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------------
  # Kibana -- la ventana de Elasticsearch
  # ------------------------------------------------------------------
  # No es una base: es el visor de Elasticsearch, igual que pgAdmin lo es de
  # PostgreSQL, DbGate de MongoDB y RedisInsight de Redis. Sirve para MIRAR
  # los indices mesh_productos y mesh_eventos_autenticacion sin escribir curl,
  # con el buscador (Discover), los campos y las agregaciones a la vista.
  # Mesh funciona igual sin el.
  #
  # La misma version que Elasticsearch (8.15.3): Kibana se niega a hablar con
  # un Elasticsearch de otra version mayor o mas nueva que la suya.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: mesh-kibana
    restart: unless-stopped
    # service_started y no service_healthy a proposito. Esperar la salud de
    # Elasticsearch haria que `docker compose up -d` se quedara detenido hasta
    # un minuto en un arranque en frio, y Kibana ya reintenta solo hasta que
    # Elasticsearch contesta.
    depends_on:
      elasticsearch:
        condition: service_started
    environment:
      # El nombre del servicio, no localhost: dentro del contenedor localhost
      # es el propio Kibana.
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"

      # El tope de memoria de Node. Sin el, Kibana toma casi 1.4 GB de heap y
      # esta maquina ya se quedo sin memoria varias veces (ver el heap de
      # Elasticsearch, aqui arriba). 640 MB alcanza para mirar dos indices.
      NODE_OPTIONS: "--max-old-space-size=640"

      # Nada de mandar datos de uso a Elastic.
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
    ports:
      # Solo localhost: Elasticsearch esta con la seguridad apagada (ver su
      # bloque), asi que Kibana, que puede leer y borrar sus indices, no debe
      # quedar abierto a la red.
      - "127.0.0.1:5601:5601"
    mem_limit: 1g

  # ------------------------------------------------------------------
  # kibana-vistas -- deja Kibana listo, una sola vez por arranque
  # ------------------------------------------------------------------
  # No es un servicio: corre docker/kibana/vistas.sh y termina. Espera a que
  # Kibana abra y a que existan los indices, crea las vistas de datos
  # (Eventos de autenticacion y Productos) y deja el rango de Discover en 60
  # dias. Es automatico a proposito: las vistas viven en el volumen de
  # Elasticsearch, no en el repositorio, y sin esto quien hace pull o corre
  # arrancar.ps1 -Reiniciar encuentra Kibana vacio.
  #
  # Usa la imagen de Kibana, que ya esta descargada y trae bash y curl. El
  # entrypoint quita los retornos de carro del script: en Windows git puede
  # entregarlo con CRLF y bash lo leeria como comandos que no existen.
  #
  # Queda en estado Exited (0) cuando termina. Es lo esperado, no un fallo.
  kibana-vistas:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: mesh-kibana-vistas
    restart: "no"
    depends_on:
      kibana:
        condition: service_started
    entrypoint: ["bash", "-c", "tr -d '\\r' < /init/vistas.sh | bash"]
    volumes:
      - ./docker/kibana:/init:ro
    mem_limit: 64m

  # ------------------------------------------------------------------
  # ClickHouse -- la base columnar de los eventos
  # ------------------------------------------------------------------
  # Es la SEXTA base y la tercera PROYECCION: la verdad de los logueos y los
  # registros sigue siendo PostgreSQL, igual que pasa con Neo4j y con
  # Elasticsearch. Se puede borrar entera y reconstruir sin perder un dato de
  # negocio, y por eso su volumen no es sagrado.
  #
  # Lo unico que NACE aqui son las vistas de producto: hoy nadie las guarda en
  # ninguna parte, y sin ellas no hay forma de saber que producto se esta
  # calentando antes de venderse.
  #
  # POR QUE ClickHouse Y NO CASSANDRA, que es la opcion de referencia del
  # enunciado. Cassandra es wide-column: guarda agrupado por clave de particion
  # y esta hecha para leer por clave conocida. Obliga a saber la pregunta ANTES
  # de guardar el dato, y cada pregunta nueva es una tabla nueva mas recargar
  # todo el historico. Detectar fraude es justamente buscar lo que no sabias que
  # ibas a buscar. ClickHouse guarda por COLUMNA y contesta con SQL lo que se le
  # ocurra a quien pregunte, sin tocar el esquema. El enunciado lo permite en
  # 5.2, "alternativas equivalentes", y en 5.5 dice que lo que se califica es la
  # calidad del analisis.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: mesh-clickhouse
    restart: unless-stopped
    environment:
      # La base y el usuario se crean en el PRIMER arranque, cuando el volumen
      # esta vacio. Si ya existe, estas tres variables no hacen nada: cambiar la
      # contrasena aqui sobre un volumen ya creado NO la cambia en la base, y es
      # la trampa que se lleva media tarde. Para eso, .\arrancar.ps1 -Reiniciar.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?falta CLICKHOUSE_DB en el .env}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?falta CLICKHOUSE_USER en el .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?falta CLICKHOUSE_PASSWORD en el .env}

      # El usuario que se crea arriba nace pudiendo repartir permisos. Se deja
      # encendido A PROPOSITO y no por comodidad: la Entrega final pide control
      # de acceso configurado explicitamente sobre al menos un componente NoSQL,
      # con roles acotados segun el servicio. Sin esto no se puede ni empezar a
      # crear esos roles desde adentro.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

      # LA ZONA HORARIA NO ES UN DETALLE AQUI, y esto se midio antes de que
      # rompiera nada: el contenedor nace en UTC y Guatemala es UTC-6, asi que
      # today() dentro de la base ya era 2026-09-07 cuando el reloj de Windows
      # decia 2026-09-06 20:34.
      #
      # En una base de eventos eso no es un desfase de seis horas, es un dia
      # entero mal contado: un panel de "ventas por dia" partiria el dia a las
      # 6 de la tarde, y todo lo que pase de ahi en adelante se sumaria al dia
      # siguiente. Nadie lo notaria, porque los numeros salen y cuadran entre
      # ellos. Solo estan corridos.
      #
      # Se comprobo: con UTC la consulta de tendencia daba 500 contra 900, y
      # con la zona puesta da 1000 contra 400, que es lo que se sembro.
      TZ: America/Guatemala
    ports:
      # 8123 es HTTP, y es por donde entra TODO: el driver de Node y la consola
      # web que la propia imagen trae en http://localhost:8123/play. No hace
      # falta un contenedor de visor como pgAdmin o DbGate.
      - "8123:8123"

      # 9000 es el protocolo nativo, el de clickhouse-client. Se publica en el
      # 9010 por fuera por la misma razon por la que Mongo salio al 27018: el
      # 9000 es de los puertos mas peleados de Windows -- Portainer, MinIO,
      # php-fpm -- y aqui no hace falta ganar esa pelea.
      - "9010:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server

      # LOS TOPES DE MEMORIA, y no son opcionales en esta maquina.
      #
      # Sin este archivo ClickHouse arranca con max_server_memory_usage al 90
      # por ciento de lo que ve y con 5 GiB reservados solo para el cache de
      # marcas. El 2026-09-06 la maquina se quedo sin memoria y mato el backend
      # y el servidor del frontend a media sesion, con ClickHouse en 800 MiB y
      # sin ningun techo puesto.
      #
      # Es el mismo cuidado que ya se le tuvo al heap de Elasticsearch aqui
      # arriba. El porque de cada numero esta dentro del propio archivo.
      #
      # Va de solo lectura porque el contenedor no tiene por que reescribir su
      # propia configuracion, y si un dia lo intenta conviene que falle en vez
      # de cambiar el repositorio por debajo.
      - ./clickhouse/config.d/limites.xml:/etc/clickhouse-server/config.d/limites.xml:ro

      # Y el tope POR CONSULTA va aparte, en users.d, porque ClickHouse lee dos
      # arboles distintos: config.d para el servidor y users.d para los
      # perfiles. Un <profiles> metido en config.d no da error y no se aplica.
      - ./clickhouse/users.d/limites-consulta.xml:/etc/clickhouse-server/users.d/limites-consulta.xml:ro
    ulimits:
      # ClickHouse abre un archivo por parte de tabla y son muchas. Con el
      # limite por defecto de Docker arranca, pero deja un aviso en el log en
      # cada inicio y se degrada cuando la tabla crece. Es el numero que la
      # propia documentacion pide.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Se pregunta con una CONSULTA de verdad y con las credenciales, no con el
      # /ping. El /ping contesta sin autenticarse y sin mirar si la base existe,
      # o sea que daria sano con la contrasena equivocada -- la misma trampa del
      # 9200 de Elasticsearch y del 7474 de Neo4j, que ya mordio dos veces.
      #
      # Asi, sano quiere decir tambien que la contrasena del .env es la que la
      # base acepta, igual que hace el healthcheck de Redis.
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1' > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Ollama, para los vectores de la recomendacion semantica (migracion 024).
  # Solo se usa si la PC NO tiene Ollama propio: etl/cargar_vectores.ps1 prueba
  # primero el del anfitrion (localhost:11434) y solo si no hay ninguno levanta
  # este. Por eso va en un perfil y un "docker compose up -d" normal no lo
  # arranca. A mano:  docker compose --profile ollama up -d ollama
  #
  # Escucha en el 11435 de afuera y no en el 11434, para no pelearse con un
  # Ollama del anfitrion que se instale despues.
  #
  # El volumen de los modelos es EXTERNO a proposito. "arrancar.ps1 -Reiniciar"
  # hace "docker compose down -v", que borra los volumenes del compose, y el
  # modelo pesa unos 560 MB: rehacer las bases no tiene que volver a bajarlo.
  # cargar_vectores.ps1 lo crea con "docker volume create" si no existe.
  #
  # Sin GPU: corre en la CPU en cualquier PC. Los 3105 vectores tardan mas que
  # con la tarjeta, pero se calculan una sola vez y despues solo lo que cambia.
  ollama:
    image: ollama/ollama:latest
    container_name: mesh-ollama
    profiles: ["ollama"]
    restart: "no"
    ports:
      - "11435:11434"
    volumes:
      - ollama-modelos:/root/.ollama

volumes:
  postgres-data:
  pgadmin-data:
  mongo-data:
  dbgate-data:
  redis-data:
  redisinsight-data:
  neo4j-data:
  neo4j-logs:
  elastic-data:
  clickhouse-data:
  clickhouse-logs:
  ollama-modelos:
    name: mesh-ollama-modelos
    external: true
