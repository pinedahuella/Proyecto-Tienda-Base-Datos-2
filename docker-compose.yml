# Las credenciales salen del archivo .env, que no se sube al repositorio.
# Si falta una variable, Compose se detiene con el mensaje que va despues del "?"
# en vez de arrancar con valores en blanco.

services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: mesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql, no en .../data
      - postgres-data:/var/lib/postgresql
      # Los scripts SQL quedan accesibles dentro del contenedor
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mesh-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?falta PGADMIN_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Deja el servidor "Mesh" ya registrado, sin tener que agregarlo a mano.
      # Los dos archivos los genera arrancar.ps1 a partir del .env.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    # pgAdmin exige que el archivo de contrasenas tenga permisos 600, y un
    # volumen montado desde Windows no los trae. Por eso se copia a /tmp antes.
    entrypoint: >
      /bin/sh -c "cp -f /pgpass /tmp/pgpass && chmod 600 /tmp/pgpass
      && chown pgadmin:root /tmp/pgpass 2>/dev/null;
      /entrypoint.sh"
    depends_on:
      - postgres

  mongo:
    image: mongo:8
    container_name: mesh-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}
      # Base que usa el proyecto. Los scripts de mongo/ se corren contra esta.
      MONGO_INITDB_DATABASE: ${MONGO_DB:?falta MONGO_DB en .env}
    ports:
      # 27018 afuera y no 27017: Windows puede tener un MongoDB instalado como
      # servicio, que ya ocupa el 27017. Los dos pueden escuchar a la vez sin
      # dar error, y el que contesta en localhost es el de Windows: Compass y
      # el backend acaban hablando con la base equivocada, vacia y sin
      # contrasena. Se comprueba con la version: la nuestra es la del
      # contenedor, la otra es la que tenga instalada la maquina.
      # Adentro de la red de Docker se sigue usando el 27017 de siempre.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      # Los scripts de las colecciones quedan accesibles dentro del
      # contenedor, igual que las migraciones de PostgreSQL
      - ./mongo:/mongo:ro
    healthcheck:
      # ping no pide autenticacion, asi que sirve de latido sin credenciales
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # La ventana de MongoDB, lo que pgAdmin es para PostgreSQL: arbol de bases y
  # colecciones a la izquierda, panel para escribir consultas, y se pueden
  # crear bases y colecciones desde ahi.
  dbgate:
    image: dbgate/dbgate:latest
    container_name: mesh-dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: mongo

      # Se conecta por el nombre del servicio y por el puerto de ADENTRO, no
      # por localhost ni por el 27018: dbgate esta en la misma red de Docker.
      LABEL_mongo: Mesh MongoDB
      ENGINE_mongo: mongo@dbgate-plugin-mongo
      URL_mongo: mongodb://${MONGO_USER:?falta MONGO_USER en .env}:${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}@mongo:27017/?authSource=admin
    ports:
      - "3001:3000"
    volumes:
      # Guarda las consultas que uno deja escritas
      - dbgate-data:/root/.dbgate
    depends_on:
      - mongo

volumes:
  postgres-data:
  pgadmin-data:
  mongo-data:
  dbgate-data:
